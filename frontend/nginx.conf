server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Fichiers hachés par Vite : cache long
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Application monopage : tout le reste renvoie index.html
  location / {
    try_files $uri /index.html;
  }
}
