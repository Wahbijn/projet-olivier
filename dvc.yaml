# Pipeline reproductible : `dvc repro` relance uniquement les étapes dont une dépendance a changé
# (code, données, configs/param.yaml). Voir README, section « Pipeline ».
#
#   data/raw + splits.csv ─► preparation ─► entrainement@<modele> ─► evaluation ─► model_V1.pt/.onnx
#
# Le découpage (data/preprocessing/splits.csv) est la référence versionnée dans Git ;
# il ne se régénère qu'explicitement : python -m src.data.preprocessing --regenerer

stages:
  preparation:
    cmd: python -m src.features.feature_extraction
    deps:
      - src/features/feature_extraction.py
      - data/raw/uguz                         # suivi par DVC (data/raw/uguz.dvc) ; ajouter data/raw/zeytin quand il sera suivi
      - data/preprocessing/splits.csv
    params:
      - configs/config.yaml:
          - pretraitement.taille_image
    outs:
      - data/processed/images_224.npy

  entrainement:
    foreach:
      - resnet50_baseline
      - efficientnet_b0_lr1e-4
      - efficientnet_b0_lr3e-4
      - efficientnet_b0_augfort
    do:
      cmd: python -m src.models.train --modele ${item}
      deps:
        - src/models/train.py
        - src/models/architectures.py
        - src/features/feature_extraction.py
        - data/processed/images_224.npy
        - data/preprocessing/splits.csv
      params:
        - configs/param.yaml:
            - modeles.${item}
            - entrainement
            - augmentation
            - decoupage.seed
      outs:
        - models/${item}.pt
        - Resultats/historique_${item}.csv:
            cache: false

  evaluation:
    cmd: python -m src.models.evaluate
    deps:
      - src/models/evaluate.py
      - data/processed/images_224.npy
      - data/preprocessing/splits.csv
      - models/resnet50_baseline.pt
      - models/efficientnet_b0_lr1e-4.pt
      - models/efficientnet_b0_lr3e-4.pt
      - models/efficientnet_b0_augfort.pt
    params:
      - configs/config.yaml:
          - modele_deploye.seuil_confiance
    outs:
      - models/model_V1.pt
      - models/model_V1.onnx
      - Resultats/comparaison_modeles.csv:
          cache: false
      - Resultats/bilan_drift.csv:
          cache: false
      - Resultats/seuils_confiance.csv:
          cache: false
    metrics:
      - Resultats/metriques.json:
          cache: false
    plots:
      - Resultats/matrices_confusion_test.png:
          cache: false
      - Resultats/drift_ks.png:
          cache: false

  detection_dataset:
    cmd: python -m src.data.make_detection_dataset
    deps:
      - src/data/make_detection_dataset.py
      - data/raw/uguz
    params:
      - configs/config.yaml:
          - detection.sources
          - detection.correspondance_classes
      - configs/param.yaml:
          - detection.decoupage
    outs:
      - data/interim/detection_manifest.csv
      - reports/data_validation/label_conflicts.csv:
          cache: false
    metrics:
      - reports/data_validation/detection_dataset.json:
          cache: false

  annotation:
    cmd: python -m src.features.auto_annotate
    deps:
      - src/features/auto_annotate.py
      - data/interim/detection_manifest.csv
      - data/raw/uguz
    params:
      - configs/config.yaml:
          - detection.classes
      - configs/param.yaml:
          - detection.annotation
    outs:
      - data/processed/yolo
      - reports/annotation_review
    metrics:
      - reports/annotation_summary.json:
          cache: false

  entrainement_yolo:
    cmd: python -m src.models.train_yolo
    deps:
      - src/models/train_yolo.py
      - data/processed/yolo
    params:
      - configs/config.yaml:
          - detection.classes
      - configs/param.yaml:
          - detection.yolo
    outs:
      - models/yolo_best.pt
      - reports/yolo:
          cache: false
    metrics:
      - reports/metrics_yolo.json:
          cache: false
