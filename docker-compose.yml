# Lancement de l'application complète :
#   docker compose up --build
# API : http://localhost:8000/docs   |   Interface : http://localhost:8080
# Prérequis : models/model_V1.pt présent (dvc pull, ou dvc repro)

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000   # URL vue par le navigateur
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
