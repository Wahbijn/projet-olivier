# Base de connaissances de l'assistant RAG.
# Seule cette LISTE est versionnée : les documents sont téléchargés en local par
# `python -m src.rag.telecharger` (ils restent la propriété de leurs auteurs, ne pas les republier).
# Si un téléchargement échoue (site qui bloque les robots), enregistrer le fichier à la main dans
# data/rag/docs/ sous le nom <id>.pdf ou <id>.html.
#
# Lacune connue : aucune source tunisienne n'a été trouvée (INRAT, ONH, Institut de l'Olivier...).
# Les ajouter ici ou dans data/rag/docs/ améliorera beaucoup la pertinence locale.

